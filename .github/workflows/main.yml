name: Build Peanut APK
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Unpack project
        run: |
          mkdir app
          ZIP=$(ls ./*.zip | head -1)
          unzip -q "$ZIP" -d app

      - name: Install packages
        working-directory: app
        run: npm install

      - name: Copy web files
        working-directory: app
        run: |
          mkdir -p www
          cp -r index.html style.css *.js manifest.json icons www/
          mkdir -p www/assets
          cp -r assets/art www/assets/
          mkdir -p www/i18n
          cp -r i18n/*.js www/i18n/
          mkdir -p www/music
          cp -r music/* www/music/ 2>/dev/null || true
          rm -f www/capacitor.config.js

      - name: Add Android project
        working-directory: app
        run: npx cap add android

      - name: Launcher icon and splash
        working-directory: app
        run: npx capacitor-assets generate --android

      - name: Notification permission
        working-directory: app
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Sync
        working-directory: app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Peanut-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
